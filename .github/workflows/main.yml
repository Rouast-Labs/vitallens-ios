name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests
    runs-on: macos-14 # Provides Xcode 15+

    env:
      VITALLENS_API_KEY: ${{ secrets.VITALLENS_API_KEY }}
      VITALLENS_BASE_URL: ${{ secrets.VITALLENS_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Run macOS Logic Tests
        run: swift test --target VitalLensInferenceTests

      - name: Run iOS Simulator Tests
        run: |
          xcodebuild test \
            -scheme vitallens-ios \
            -destination "platform=iOS Simulator,name=iPhone Air,OS=latest" \
            -skip-testing:VitalLensInferenceTests
