name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests
    runs-on: macos-15

    env:
      VITALLENS_API_KEY: ${{ secrets.VITALLENS_API_KEY }}
      VITALLENS_BASE_URL: ${{ secrets.VITALLENS_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run macOS Logic Tests
        run: swift test --filter VitalLensInferenceTests

      - name: Run iOS Simulator Tests
        run: |
          xcodebuild test \
            -scheme vitallens-ios-Package \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro,OS=latest" \
            -skip-testing:VitalLensInferenceTests
